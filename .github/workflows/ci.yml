# Runs on every push and every pull request, with no path filter.
#
# The deploy workflow is deliberately scoped to frontend/**, because rebuilding the site for a
# contract change would be waste. This one is the opposite: it should run on everything, so each
# commit carries proof that the suite passed at that revision rather than only at the tip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Lint
        run: forge lint src script

      - name: Test
        run: forge test -vv

      # The size limit is a hard on-chain constraint, so it is asserted rather than eyeballed
      # in the build output.
      - name: Assert KnotHook fits the 24,576 byte limit
        run: |
          SIZE=$(forge build --sizes --json | python3 -c "import json,sys; print(json.load(sys.stdin)['KnotHook']['runtime_size'])")
          echo "KnotHook runtime size: $SIZE bytes"
          test "$SIZE" -lt 24576

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20 is not incidental: the lockfile is generated by the npm that ships with it.
      # A different major resolves the tree differently and npm ci rejects the lock.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
