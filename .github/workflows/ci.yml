# Runs on every push and every pull request, with no path filter.
#
# The deploy workflow is deliberately scoped to apps/web/**, because rebuilding the site for a
# contract change would be waste. This one is the opposite: it should run on everything, so each
# commit carries proof that the suite passed at that revision rather than only at the tip.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.2

      - name: Format
        run: forge fmt --check

      - name: Build, lint, and assert runtime size
        run: |
          forge lint src script
          forge build --sizes
          SIZE=$(forge build --sizes --json | python3 -c "import json,sys; print(json.load(sys.stdin)['KnotHook']['runtime_size'])")
          echo "KnotHook runtime size: $SIZE bytes"
          test "$SIZE" -lt 24576

      - name: Test
        run: forge test -vv

      - name: Source-only coverage
        run: forge coverage --ir-minimum --no-match-coverage '^(test|script)/' --report summary

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # wagmi pulls walletconnect transitive moderate/high advisories with no critical;
      # gate on critical so the wallet stack does not fail every build on upstream noise.
      - run: npm audit --audit-level=critical
      - run: npm run check --workspace @knot/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
