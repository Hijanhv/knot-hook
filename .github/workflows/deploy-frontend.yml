# Builds the frontend as a static export and publishes it to GitHub Pages.
#
# The app prerenders every route, so there is no server to run and no vendor to depend on: the
# build is a folder of files any static host can serve. NEXT_PUBLIC_BASE_PATH is set because
# Pages serves this repo from /<repo>/ rather than a root domain; without it every asset 404s
# and the page renders unstyled.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "deployments/unichain-sepolia.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Verify frontend
        run: |
          # See ci.yml: wagmi's transitive advisories are moderate/high, none critical.
          npm audit --audit-level=critical
          npm run typecheck --workspace @knot/web
          npm run lint --workspace @knot/web
          npm test --workspace @knot/web

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build --workspace @knot/web

      # Pages runs the output through Jekyll unless told not to, which strips _next/.
      - name: Disable Jekyll
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
